<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operations Matrix - Upstream Prototype</title>
  <style>
    :root {
      --bg: #111417; --bg2: #1c2329; --panel: rgba(255,255,255,.08); --text: #eef3ef;
      --muted: #b7c2b8; --accent: #4dbf8c; --accent2: #d28a3a; --border: rgba(232,240,233,.16);
      --ok: #57d2a1; --warn: #ffcc66; --risk: #ff8f8f;
    }
    [data-theme="light"] {
      --bg: #f7f4ec; --bg2: #ece6d9; --panel: rgba(255,255,255,.85); --text: #1d2521;
      --muted: #5d6d63; --accent: #2f9f71; --accent2: #b7722e; --border: rgba(29,37,33,.16);
      --ok: #169a6e; --warn: #b97711; --risk: #c24141;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
      background:
        radial-gradient(1000px 500px at -10% -20%, var(--accent2), transparent 70%),
        radial-gradient(1000px 500px at 120% 20%, var(--accent), transparent 70%),
        linear-gradient(160deg,var(--bg),var(--bg2));
      min-height:100vh;
    }
    .container{width:min(1200px,94vw);margin:24px auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .badge{display:inline-block;padding:6px 12px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .theme-switcher button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-left:6px;cursor:pointer}
    .page-nav{display:flex;gap:8px;margin:10px 0 16px}
    .page-nav a{text-decoration:none;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px 10px;background:var(--panel);font-weight:600;font-size:13px}
    .page-nav a.active{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .layout{display:grid;grid-template-columns:2fr 1fr;gap:14px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
    .service{margin-bottom:14px}
    .service h3{margin:0 0 8px}
    .service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    .chamber{border:1px dashed var(--border);border-radius:10px;padding:8px}
    .chamber-title{font-size:12px;color:var(--muted);margin-bottom:6px}
    .beds{display:flex;gap:8px;flex-wrap:wrap}
    .bed{border:1px solid var(--border);border-radius:8px;padding:7px 8px;cursor:pointer;font-size:12px;min-width:100px;text-align:center}
    .bed.free{background:rgba(77,191,140,.15)}
    .bed.occupied{background:rgba(210,138,58,.2)}
    .bed.selected{outline:2px solid var(--accent)}
    .muted{color:var(--muted)}
    .status-ok{color:var(--ok)} .status-med{color:var(--warn)} .status-risk{color:var(--risk)}
    .row{display:flex;justify-content:space-between;gap:10px;border:1px dashed var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px}
    button.action{border:0;border-radius:8px;padding:8px 10px;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));cursor:pointer}
    select{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);padding:8px}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <span class="badge">Operations Matrix</span>
      <div class="theme-switcher">
        <button type="button" onclick="setTheme('dark')">Dark</button>
        <button type="button" onclick="setTheme('light')">Light</button>
        <button type="button" onclick="setTheme('auto')">Auto</button>
      </div>
    </div>
    <h1>Service / Chamber / Bed Occupancy Matrix</h1>
    <p class="muted">Click any bed to inspect details. Occupied beds show patient info; discharge frees the bed immediately.</p>
    <nav class="page-nav">
      <a href="index.html">Forecast & Coordination</a>
      <a class="active" href="operations.html">Operations Matrix</a>
    </nav>

    <div class="layout">
      <section class="card">
        <div id="matrix"></div>
      </section>
      <aside class="card">
        <h3>Selected bed</h3>
        <div id="bedDetails" class="muted">Select a bed in the matrix.</div>
      </aside>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "upstream-shared-state-v1";
    const THEME_KEY = "upstream-theme-mode";
    const LEGACY_THEME_KEY = "theme";
    let themeMode = "auto";
    let selectedBedId = null;

    function resolveAutoTheme(){const h=new Date().getHours();return (h>=7&&h<19)?"light":"dark";}
    function applyTheme(mode){document.documentElement.setAttribute("data-theme",mode==="auto"?resolveAutoTheme():mode);}
    function setTheme(theme){if(!["dark","light","auto"].includes(theme))return;themeMode=theme;localStorage.setItem(THEME_KEY,themeMode);applyTheme(themeMode);}
    function loadTheme(){const saved=localStorage.getItem(THEME_KEY);const legacy=localStorage.getItem(LEGACY_THEME_KEY);themeMode=["dark","light","auto"].includes(saved||legacy)?(saved||legacy):"auto";localStorage.setItem(THEME_KEY,themeMode);localStorage.removeItem(LEGACY_THEME_KEY);applyTheme(themeMode);}

    function loadState(){
      try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(raw) return JSON.parse(raw);
      }catch(_){}
      return {patients:[],beds:[]};
    }
    function saveState(state){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function statusClass(risk){if(risk==="critical")return"status-risk";if(risk==="warning"||risk==="info")return"status-med";return"status-ok";}

    function renderMatrix() {
      const state = loadState();
      const byService = {};
      for (const bed of state.beds || []) {
        byService[bed.service] ||= {};
        byService[bed.service][bed.chamber] ||= [];
        byService[bed.service][bed.chamber].push(bed);
      }
      const matrix = document.getElementById("matrix");
      const serviceHtml = Object.keys(byService).sort().map((service) => {
        const chambers = byService[service];
        const chamberHtml = Object.keys(chambers).sort().map((chamber) => {
          const beds = chambers[chamber].sort((a,b)=>a.number-b.number);
          const bedHtml = beds.map((bed) => {
            const occ = !!bed.occupiedBy;
            const cls = occ ? "occupied" : "free";
            const selected = bed.bedId === selectedBedId ? " selected" : "";
            return `<button class="bed ${cls}${selected}" onclick="selectBed('${bed.bedId}')">#${bed.number} • ${bed.type}<br>${occ ? "occupied" : "free"}</button>`;
          }).join("");
          return `<div class="chamber"><div class="chamber-title">${chamber}</div><div class="beds">${bedHtml}</div></div>`;
        }).join("");
        return `<div class="service"><h3>${service}</h3><div class="service-grid">${chamberHtml}</div></div>`;
      }).join("");
      matrix.innerHTML = serviceHtml || "<p class='muted'>No bed model yet. Open index and book a patient first.</p>";
      renderBedDetails();
    }

    function selectBed(bedId){selectedBedId = bedId; renderMatrix();}

    function dischargePatient(patientId){
      const state=loadState();
      const p=state.patients.find((x)=>x.patientId===patientId);
      if(!p) return;
      p.status="discharged";
      p.dischargeTimestamp=new Date().toISOString();
      if(p.bedId){
        const bed=state.beds.find((b)=>b.bedId===p.bedId);
        if(bed) bed.occupiedBy=null;
      }
      p.bedId=null;
      saveState(state);
      renderMatrix();
    }

    function assignPatientToBed(){
      const state=loadState();
      const patientId=document.getElementById("assignPatient").value;
      if(!selectedBedId||!patientId) return;
      const bed=state.beds.find((b)=>b.bedId===selectedBedId);
      const patient=state.patients.find((p)=>p.patientId===patientId);
      if(!bed||!patient||bed.occupiedBy) return;
      if(patient.bedId){
        const old=state.beds.find((b)=>b.bedId===patient.bedId);
        if(old) old.occupiedBy=null;
      }
      bed.occupiedBy=patient.patientId;
      patient.bedId=bed.bedId;
      patient.status="booked";
      saveState(state);
      renderMatrix();
    }

    function renderBedDetails(){
      const state=loadState();
      const host=document.getElementById("bedDetails");
      const bed=(state.beds||[]).find((b)=>b.bedId===selectedBedId);
      if(!bed){host.textContent="Select a bed in the matrix.";return;}
      const patient=(state.patients||[]).find((p)=>p.patientId===bed.occupiedBy);
      if(patient){
        host.innerHTML=`
          <div class="row"><strong>Bed</strong><span>${bed.bedId} (${bed.type})</span></div>
          <div class="row"><strong>Patient</strong><span>${patient.name} (${patient.patientId})</span></div>
          <div class="row"><strong>Service</strong><span>${patient.unitService}</span></div>
          <div class="row"><strong>Procedure</strong><span>${patient.procedureType} / ${patient.procedureSubtype || "n/a"}</span></div>
          <div class="row"><strong>Threshold risk</strong><span class="${statusClass(patient.thresholdRisk)}">${(patient.thresholdRisk || "safe").toUpperCase()}</span></div>
          <div class="row"><strong>Status</strong><span>${patient.status || "booked"}</span></div>
          <button class="action" onclick="dischargePatient('${patient.patientId}')">Discharge patient (free bed)</button>
        `;
      } else {
        const waiting=(state.patients||[]).filter((p)=>!p.bedId && p.status!=="discharged");
        const options=waiting.map((p)=>`<option value="${p.patientId}">${p.patientId} • ${p.name} (${p.unitService})</option>`).join("");
        host.innerHTML=`
          <div class="row"><strong>Bed</strong><span>${bed.bedId} (${bed.type})</span></div>
          <div class="row"><strong>Status</strong><span class="status-ok">FREE</span></div>
          <label class="muted">Assign waiting patient</label>
          <select id="assignPatient">
            <option value="">Select patient</option>
            ${options}
          </select>
          <div style="height:8px;"></div>
          <button class="action" onclick="assignPatientToBed()">Assign to selected bed</button>
        `;
      }
    }

    window.addEventListener("storage",(e)=>{if(e.key===STORAGE_KEY) renderMatrix();});
    loadTheme();
    setInterval(()=>{if(themeMode==="auto")applyTheme("auto");},60000);
    renderMatrix();
  </script>
</body>
</html>
