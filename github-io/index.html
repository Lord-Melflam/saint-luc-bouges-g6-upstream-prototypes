<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upstream Prototype Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f7f8fb; color: #1f2937; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input, select { padding: 8px; width: 100%; max-width: 360px; }
    button { margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <h1>Upstream Prototype Demo</h1>
  <p>Mini GitHub Pages demo for Week 11: LOS forecast + communication trigger preview.</p>

  <div class="card">
    <h2>LOS Forecast Calculator</h2>
    <label>Procedure type</label>
    <select id="procedure">
      <option value="orthopedic">orthopedic</option>
      <option value="digestive">digestive</option>
      <option value="urology">urology</option>
      <option value="cardiovascular">cardiovascular</option>
      <option value="general_surgery">general_surgery</option>
      <option value="emergency">emergency</option>
      <option value="neurology">neurology (fallback)</option>
    </select>

    <label>Age</label>
    <input id="age" type="number" value="72" />

    <label>Comorbidity score (0-4)</label>
    <input id="comorbidity" type="number" min="0" max="4" value="2" />

    <label>Social complexity</label>
    <select id="social">
      <option value="false">false</option>
      <option value="true">true</option>
    </select>

    <label>Post-acute need</label>
    <select id="postacute">
      <option value="false">false</option>
      <option value="true">true</option>
    </select>

    <button onclick="runForecast()">Compute</button>
    <pre id="result" class="mono"></pre>
  </div>

  <div class="card">
    <h2>Communication trigger preview</h2>
    <p class="mono" id="messages"></p>
  </div>

  <script>
    const BASE = {
      orthopedic: 4.0,
      digestive: 6.0,
      urology: 5.0,
      cardiovascular: 8.0,
      general_surgery: 5.0,
      emergency: 7.0
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function runForecast() {
      const procedure = document.getElementById("procedure").value;
      const age = Number(document.getElementById("age").value);
      const comorbidity = Number(document.getElementById("comorbidity").value);
      const social = document.getElementById("social").value === "true";
      const postacute = document.getElementById("postacute").value === "true";

      let score = BASE[procedure] ?? 5.5;
      if (age >= 75) score += 1.0;
      else if (age >= 65) score += 0.5;
      score += Math.min(comorbidity * 0.6, 3.0);
      if (social) score += 1.5;
      if (postacute) score += 1.0;
      if (procedure === "emergency") score += 0.8;
      const los = Math.max(1, Math.round(score));

      let confidence = 0.92;
      confidence -= Math.min(comorbidity * 0.08, 0.4);
      if (social) confidence -= 0.12;
      if (postacute) confidence -= 0.10;
      if (procedure === "emergency") confidence -= 0.08;
      confidence = clamp(confidence, 0.35, 0.95);

      const confidenceLabel = confidence >= 0.75 ? "high" : confidence >= 0.55 ? "medium" : "low";
      const earlyFlag = confidenceLabel === "low" || social || postacute || los >= 7;

      const today = new Date();
      const expected = new Date(today.getTime() + los * 24 * 3600 * 1000);
      const d2 = new Date(expected.getTime() - 2 * 24 * 3600 * 1000);
      const d1 = new Date(expected.getTime() - 1 * 24 * 3600 * 1000);

      const fmt = d => d.toISOString().slice(0, 10);
      document.getElementById("result").textContent =
`predicted_los_days: ${los}
confidence: ${confidence.toFixed(2)} (${confidenceLabel})
expected_discharge_date: ${fmt(expected)}
early_coordination_flag: ${earlyFlag ? "yes" : "no"}`;

      document.getElementById("messages").textContent =
`D-2 (${fmt(d2)}): Share expected discharge date and preparation steps.
D-1 (${fmt(d1)}): Confirm expected discharge and practical checklist.
D0 (${fmt(expected)}): Final departure slot and post-discharge instructions.`;
    }

    runForecast();
  </script>
</body>
</html>
